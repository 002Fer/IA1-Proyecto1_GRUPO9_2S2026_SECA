name: CI/CD Pipeline - Logic Detective

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-tests:
    name: Backend Tests (Python + Prolog)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog swi-prolog-nox

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: ./Proyecto_1/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Unit Tests
        working-directory: ./Proyecto_1/backend
        run: |
          python -m pytest tests/ -v

  frontend-build:
    name: Frontend Build y Lint (React / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./Proyecto_1/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./Proyecto_1/frontend
        run: |
          npm ci

      - name: Build Frontend Application
        working-directory: ./Proyecto_1/frontend
        run: |
          npm run build
